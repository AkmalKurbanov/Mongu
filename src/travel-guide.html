<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Авторские туры по Кыргызстану | Mongu</title>
    <meta
      name="description"
      content="Индивидуальные и авторские джип-туры, конные прогулки и экспедиции по самым красивым перевалам и озерам Кыргызстана с опытными гидами." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Авторские туры по Кыргызстану — Mongu" />
    <meta property="og:description" content="Индивидуальные джип-туры и конные экспедиции по Кыргызстану." />
    <meta property="og:url" content="https://mongu.kg/" />
    <meta property="og:image" content="https://mongu.kg/images/og-image.jpg" />

    <meta name="theme-color" content="#6c613e" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#3F3F25" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="canonical" href="https://mongu.kg/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TravelAgency",
        "name": "Mongu",
        "description": "Authentic nomadic expeditions, overland jeep journeys, and horseback tours in Kyrgyzstan.",
        "url": "https://mongu.kg/about.html",
        "logo": "https://mongu.kg/images/logo.png",
        "image": "https://mongu.kg/images/hero/hero-desktop-2x.jpg",
        "telephone": "+996555123456",
        "email": "mongu.karakol@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Karakol",
          "addressRegion": "Issyk-Kul",
          "addressCountry": "KG"
        },
        "sameAs": ["https://www.instagram.com/mongu", "https://www.facebook.com/mongu"],
        "foundingDate": "2016",
        "knowsAbout": ["Trekking in Kyrgyzstan", "Nomadic culture", "Jeep tours in Central Asia", "Tian Shan mountains"]
      }
    </script>
  </head>
  <body>
    <load src="./partials/whatapp-btn.html" />
    <load src="./partials/header.html" />

    <section class="hero hero_inside">
      <div class="hero__media">
        <div class="hero__poster">
          <picture>
            <source
              type="image/avif"
              media="(min-width: 1024px)"
              srcset="./images/hero-categories/trekking-hero-1440.avif" />
            <source
              type="image/webp"
              media="(min-width: 1024px)"
              srcset="./images/hero-categories/trekking-hero-1440.webp" />
            <img
              src="./images/hero-categories/trekking-hero-1440.jpg"
              alt="Booking"
              class="hero__poster-img"
              width="1440"
              height="400"
              fetchpriority="high"
              loading="eager" />
          </picture>
        </div>
      </div>
      <div class="hero__content">
        <div class="container">
          <h1 class="hero__title">Travel guide</h1>
        </div>
      </div>
    </section>

    <main class="travel-guide section-padding-bottom">
      <div class="breadcrumbs">
        <div class="container">
          <nav aria-label="Хлебные крошки">
            <ul class="breadcrumbs__list">
              <li class="breadcrumbs__item">
                <a class="breadcrumbs__link" href="/">Home</a>
              </li>
              <li class="breadcrumbs__item" aria-current="page">Travel guide</li>
            </ul>
          </nav>
        </div>
      </div>

      <section class="section-padding-bottom">
  <div class="container">

    <div class="content-grid">
      <!-- Универсальная карточка -->
      <article class="content-card">
        <div class="content-card__visual">
          <picture>
            <source
              type="image/avif"
              sizes="(min-width: 1024px) 50vw, 100vw"
              srcset="
                ./images/path-600.avif   600w,
                ./images/path-1200.avif 1200w
              " />
            <source
              type="image/webp"
              sizes="(min-width: 1024px) 50vw, 100vw"
              srcset="
                ./images/path-600.webp   600w,
                ./images/path-1200.webp 1200w
              " />
            <img
              src="./images/path-600.jpg"
              alt="Описание изображения"
              width="600"
              height="400"
              loading="lazy"
              decoding="async" />
          </picture>
          <div class="content-card__badge">
            <svg class="icon"><use href="/icons.svg#tag"></use></svg> Лейбл
          </div>
        </div>

        <div class="content-card__content">
          <div class="content-card__header">
            <h2 class="content-card__title">Title Lorem ipsum dolor sit amet.</h3>
            <p class="content-card__desc">
              Lorem ipsum dolor sit amet consectetur adipisicing elit. Iusto id eos ea, dolor quia excepturi?
            </p>
          </div>

          <!-- Универсальный список (метаданные, фичи, удобства) -->
          <ul class="content-card__list">
            <li>
              <svg class="icon"><use href="/icons.svg#icon1"></use></svg> Пункт 1
            </li>
            <li>
              <svg class="icon"><use href="/icons.svg#icon2"></use></svg> Пункт 2
            </li>
            <li>
              <svg class="icon"><use href="/icons.svg#icon3"></use></svg> Пункт 3
            </li>
            <li>
              <svg class="icon"><use href="/icons.svg#icon4"></use></svg> Пункт 4
            </li>
          </ul>

          <div class="content-card__footer">
            <div class="content-card__stats">
              <span class="content-card__stats-label">Лейбл (от / время)</span>
              <span class="content-card__stats-val">Tag, category</span>
            </div>
            <a href="#" class="btn btn_bordered">Read more</a>
          </div>
        </div>
      </article>
      
    </div>
  </div>
</section>
    </main>

    <load src="./partials/footer.html" />
    <load src="./partials/mobile-menu.html" />
    <load src="./partials/sprite-inline.html" />

    <script type="module" src="./js/travel-guide.js"></script>
  </body>
</html>
